# Prism experiment configuration — single source of truth for a reproducible
# run (CLAUDE.md §6). Every field below is either a settled design decision
# (SPEC/ADR-backed) or an explicit TODO pending a later REQ. Do not fill a
# TODO with a guessed value — resolve it via the REQ named next to it.

model:
  name: EleutherAI/pythia-70m-deduped  # SPEC §3.1 / ADR-0010: the SAE below was trained against the
                                        # deduped checkpoint specifically, not plain pythia-70m
  checkpoint_revision: e93a9faa9c77e5d09219f6c868bfc7a1bd65593c  # pinned commit, not `main` -- same
                                                                  # reproducibility rule CLAUDE.md §2
                                                                  # requires for the SAE checkpoint below

sae:
  # REQ-1 / ADR-0010: resolved to an existing SAE (ADR-0002's first branch) — the exact dictionary
  # already scored by the identifiability audit. Revision is pinned to a commit, not `main`, and the
  # checksum is recorded so a run can be reconstructed from this file alone.
  checkpoint_repo: ghidav/pythia-70m-deduped-sae
  checkpoint_revision: 473774a054588503a90844f1afdb7b8fbf5f32a0
  checkpoint_subfolder: test/blocks.4.hook_resid_pre
  checkpoint_sha256: fdcb4553f5c4b44ddf04e5bfc98b0eddf71ee64c7de657af6eaa3d5e0c95b90f
  checkpoint_cfg_sha256: c7d1932eec59818e34d5ad6d3c23a7d9a870ae9db5fa0f34fb90c60aabeec7ec
  hook_name: blocks.4.hook_resid_pre

injection:
  layer: TODO  # REQ-10 / ADR-0009: UCARE compression-boundary layer, else the 2/3-depth fallback
  strengths: [1, 2, 4, 8]  # REQ-5 / ADR-0016: working band from the calibration pilot, spanning the
                            # weak/borderline edge through the confirmed too-strong boundary on this
                            # checkpoint -- see data/results/calibration_notes.md

features:
  n_total: 40  # REQ-2 / SPRINT-PLAN.md §3.2: sample size within the 30-50 range the spec calls for
  sample_seed: 0  # REQ-2: fixed seed for stratified_sample() reproducibility

identifiability_source:
  # REQ-2 / issue #17: per-feature identifiability comes from a separate project
  # (sae-bounding), merged as of this commit. Pinned the same way the SAE checkpoint
  # above is -- a commit, not `main`, and a checksum audit_build.py verifies before
  # trusting the file, not just records after the fact.
  repo: aruneem-bhowmick/sae-bounding
  commit: 09cc4a498f57e488befb9dbd4f07c5d30e8dca26
  checksum: b6ded2c93f829726f4d49ad440c2e1218d016472b43cb6ec383836adf503567a

sampling:
  seeds: [0, 1, 2]  # REQ-6 / ADR-0008: multiple seeds per condition to estimate variance at temperature 1

generation:
  temperature_qualitative: 0  # ADR-0008: deterministic, for calibration pilots and report examples
  temperature_systematic: 1   # ADR-0008: for every trial feeding the statistics

judge:
  model: TODO  # ADR-0004: Anthropic API judge — pin the specific model id when REQ-8 is implemented
