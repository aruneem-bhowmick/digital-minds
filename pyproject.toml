[project]
name = "prism"
version = "0.1.0"
description = "Does frame-theoretic SAE feature identifiability predict introspective detectability in a concept-injection paradigm?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformer-lens==3.7.1",
    "sae-lens==6.49.1",
    "torch==2.6.0",
    "sentencepiece==0.2.0",
    "transformers==5.9.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "statsmodels==0.14.6",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "anthropic==0.122.0",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    "datasets==5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises a real model/SAE load or network call, not a mock (slower; still run by default per CLAUDE.md's rule against faked pipeline stages)",
]
